<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Balance Collection</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      color: #262626;
      padding: 20px 10px;
    }

    .container {
      max-width: 470px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #efefef;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #262626;
    }

    .pinned-tag {
      font-size: 11px;
      background: #0095f6;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* Carousel / Swiper Styles */
    .carousel-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f0f0f0;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 2;
    }

    .dots-container {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 2;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transition: background 0.2s ease;
    }

    .dot.active {
      background: #ffffff;
    }

    /* Card Details */
    .card-body {
      padding: 14px 16px;
    }

    .price {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .caption {
      font-size: 13px;
      line-height: 1.4;
      color: #4a4a4a;
      margin-bottom: 12px;
    }

    .sizes-label {
      font-size: 12px;
      font-weight: 600;
      color: #8e8e8e;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .sizes-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .size-btn {
      border: 1px solid #ccc;
      background: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .size-btn:hover, .size-btn.active {
      background: #262626;
      color: #fff;
      border-color: #262626;
    }
  </style>
</head>
<body>

  <div class="container" id="product-container"></div>

  <script>
    const products = [    
      {      
        id: 1,      
        category: "new-balance",      
        pinned: true,      
        name: "HIGH QUALITY NEW BALANCE SNEAKERS 1906",      
        price: 85000,      
        caption: "HIGH QUALITY NEW BALANCE SNEAKERS 1906 - Premium Build & Comfort.",      
        images: [
          "https://res.cloudinary.com/vpgritcv/image/upload/v1788818606/WhatsApp_Image_2026-09-07_at_14.50.06.jpg",
          "https://res.cloudinary.com/vpgritcv/image/upload/v1788818605/WhatsApp_Image_2026-09-07_at_14.50.06_1.jpg"
        ],      
        sizes: ["40", "41", "42", "43", "44", "45"]    
      },
      {      
        id: 2,      
        category: "new-balance",      
        pinned: false,      
        name: "HIGH QUALITY NEW BALANCE SNEAKERS",      
        price: 85000,      
        caption: "HIGH QUALITY NEW BALANCE SNEAKERS - Premium Build & Comfort.",      
        images: [
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384369/WhatsApp_Image_2026-09-13_at_08.33.37_1.jpg",
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384366/WhatsApp_Image_2026-09-13_at_08.33.37.jpg"
        ],      
        sizes: ["40", "41", "42", "43", "44", "45"]    
      },
      {      
        id: 3,      
        category: "new-balance",      
        pinned: false,      
        name: "HIGH QUALITY NEW BALANCE SNEAKERS",      
        price: 85000,      
        caption: "HIGH QUALITY NEW BALANCE SNEAKERS - Premium Build & Comfort.",      
        images: [
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384365/WhatsApp_Image_2026-09-13_at_08.33.19.jpg"
        ],      
        sizes: ["40", "41", "42", "43", "44", "45"]    
      },
      {      
        id: 4,      
        category: "new-balance",      
        pinned: false,      
        name: "HIGH QUALITY NEW BALANCE SNEAKERS",      
        price: 85000,      
        caption: "HIGH QUALITY NEW BALANCE SNEAKERS - Premium Build & Comfort.",      
        images: [
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384365/WhatsApp_Image_2026-09-13_at_08.33.31.jpg"
        ],      
        sizes: ["40", "41", "42", "43", "44", "45"]    
      },
      {      
        id: 5,      
        category: "new-balance",      
        pinned: false,      
        name: "HIGH QUALITY NEW BALANCE SNEAKERS",      
        price: 85000,      
        caption: "HIGH QUALITY NEW BALANCE SNEAKERS - Premium Build & Comfort.",      
        images: [
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384365/WhatsApp_Image_2026-09-13_at_08.33.35_1.jpg"
        ],      
        sizes: ["40", "41", "42", "43", "44", "45"]    
      },
      {      
        id: 6,      
        category: "new-balance",      
        pinned: false,      
        name: "HIGH QUALITY NEW BALANCE SNEAKERS",      
        price: 85000,      
        caption: "HIGH QUALITY NEW BALANCE SNEAKERS - Premium Build & Comfort.",      
        images: [
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384365/WhatsApp_Image_2026-09-13_at_08.33.33.jpg",
          "https://res.cloudinary.com/vpgritcv/image/upload/v1789384364/WhatsApp_Image_2026-09-13_at_08.33.34.jpg"
        ],      
        sizes: ["40", "41", "42", "43", "44", "45"]    
      }
    ];

    function renderProducts() {
      const container = document.getElementById("product-container");
      
      container.innerHTML = products.map(product => {
        const isMultiple = product.images.length > 1;
        
        const imagesHTML = product.images.map(img => `
          <div class="carousel-slide">
            <img src="${img}" alt="${product.name}" loading="lazy">
          </div>
        `).join("");

        const dotsHTML = isMultiple ? `
          <div class="dots-container">
            ${product.images.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
          </div>
        ` : '';

        const sizesHTML = product.sizes.map(size => `
          <button class="size-btn">${size}</button>
        `).join("");

        return `
          <div class="card" id="product-${product.id}">
            <div class="card-header">
              <span class="card-title">${product.name}</span>
              ${product.pinned ? `<span class="pinned-tag">Pinned</span>` : ""}
            </div>
            
            <div class="carousel-container">
              <div class="carousel-track" onscroll="updateCarousel(this, ${product.images.length})">
                ${imagesHTML}
              </div>
              ${isMultiple ? `<span class="badge" id="badge-${product.id}">1/${product.images.length}</span>` : ""}
              ${dotsHTML}
            </div>

            <div class="card-body">
              <div class="price">₦${product.price.toLocaleString()}</div>
              <p class="caption">${product.caption}</p>
              
              <div class="sizes-label">Available Sizes</div>
              <div class="sizes-grid">
                ${sizesHTML}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function updateCarousel(trackElement, total) {
      const card = trackElement.closest('.card');
      const productId = card.id.replace('product-', '');
      const slideWidth = trackElement.clientWidth;
      const currentIndex = Math.round(trackElement.scrollLeft / slideWidth);

      // Update badge counter
      const badge = document.getElementById(`badge-${productId}`);
      if (badge) {
        badge.textContent = `${currentIndex + 1}/${total}`;
      }

      // Update active dot
      const dots = card.querySelectorAll('.dot');
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }

    renderProducts();
  </script>
</body>
</html>
